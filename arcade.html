<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Construct Flows — Workflow Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── RESET + ROOT ─────────────────────────── */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #060a12;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP RESOURCE BAR ─────────────────────── */
    #rts-topbar {
      flex-shrink: 0;
      height: 36px;
      background: #060a10;
      border-bottom: 1px solid #1a2535;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 0;
      z-index: 10;
    }
    .rts-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      letter-spacing: 3px;
      color: rgba(100,150,255,0.45);
      text-transform: uppercase;
      padding-right: 12px;
      border-right: 1px solid #1a2535;
    }
    .rts-resource {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      border-right: 1px solid #1a2535;
    }
    .rts-res-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .rts-res-val {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      min-width: 36px;
    }
    .rts-res-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #3a4a5a;
    }
    #rts-clock {
      margin-left: auto;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(100,150,255,0.3);
    }

    /* ── BODY ─────────────────────────────────── */
    #rts-body { flex: 1; display: flex; overflow: hidden; }
    #rts-center { flex: 1; overflow: hidden; position: relative; }

    /* ── SCREENS ──────────────────────────────── */
    .screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 14px; }
    .screen.hidden { display: none; }
    .screen-grid-bg {
      position: absolute; inset: 0;
      background:
        repeating-linear-gradient(0deg, transparent, transparent 28px, rgba(100,150,255,0.025) 28px, rgba(100,150,255,0.025) 29px),
        repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(100,150,255,0.025) 28px, rgba(100,150,255,0.025) 29px);
      pointer-events: none;
    }

    /* ── SIDEBAR ──────────────────────────────── */
    #rts-sidebar {
      width: 72px;
      background: #060a10;
      border-left: 1px solid #1a2535;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sidebar-title {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 6px;
      letter-spacing: 2px;
      color: rgba(100,150,255,0.3);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .sidebar-stat-name {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 5.5px;
      letter-spacing: 1px;
      color: #3a4a5a;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .sidebar-bar { height: 3px; background: #0d1520; border: 1px solid #1a2535; overflow: hidden; }
    .sidebar-bar-fill { height: 100%; width: 0%; transition: width 0.4s ease; }
    .sidebar-val { font-family: 'IBM Plex Mono', monospace; font-size: 5.5px; color: #3a4a5a; margin-top: 1px; }
    .sidebar-divider { height: 1px; background: #1a2535; margin: 2px 0; }

    /* ── COMMAND BAR ──────────────────────────── */
    #rts-cmdbar {
      flex-shrink: 0;
      height: 38px;
      background: #060a10;
      border-top: 1px solid #1a2535;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      z-index: 10;
    }
    .cmd-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid #1a2535;
      background: rgba(100,150,255,0.04);
      color: rgba(100,150,255,0.3);
      padding: 5px 12px;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, box-shadow 0.12s;
      white-space: nowrap;
    }
    .cmd-btn:hover:not(:disabled) { border-color: rgba(100,150,255,0.35); color: rgba(100,150,255,0.7); }
    .cmd-btn.primary {
      border-color: rgba(100,150,255,0.5);
      color: rgba(100,150,255,0.9);
      box-shadow: 0 0 8px rgba(100,150,255,0.12), inset 0 0 8px rgba(100,150,255,0.04);
    }
    .cmd-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    #cmd-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 7px;
      letter-spacing: 2px;
      color: #3a4a5a;
      text-transform: uppercase;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #cmd-status span { color: rgba(100,150,255,0.5); }

    /* ── HOME SCREEN ──────────────────────────── */
    #screen-home {
      background:
        radial-gradient(ellipse at 50% 30%, rgba(40,60,120,0.15) 0%, transparent 60%),
        linear-gradient(180deg, #0a0e18 0%, #060a12 100%);
      gap: 10px;
    }
    .map-header { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1; }
    .map-title { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 3px; color: rgba(100,150,255,0.4); text-transform: uppercase; }
    .map-blink { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 2px; color: rgba(100,150,255,0.25); animation: blink 1.4s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    .territory-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      position: relative;
      z-index: 1;
      flex: 1;
    }
    .territory {
      background: rgba(20,35,60,0.5);
      border: 1px solid rgba(60,100,140,0.25);
      padding: 10px 9px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .territory::before {
      content: '';
      position: absolute;
      left: 0; top: 0;
      width: 2px; height: 100%;
      background: transparent;
      transition: background 0.15s;
    }
    .territory:hover { border-color: rgba(100,150,255,0.4); background: rgba(30,50,100,0.35); }
    .territory.captured { border-color: rgba(100,220,160,0.35); background: rgba(10,50,30,0.5); }
    .territory.captured::before { background: rgba(100,220,160,0.8); }
    .territory.fog { opacity: 0.22; pointer-events: none; }
    .t-num { font-family: 'IBM Plex Mono', monospace; font-size: 6px; letter-spacing: 2px; color: rgba(100,150,255,0.35); text-transform: uppercase; margin-bottom: 4px; }
    .territory.captured .t-num { color: rgba(100,220,160,0.5); }
    .t-name { font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 1px; color: rgba(180,200,230,0.8); line-height: 1.1; flex: 1; }
    .territory.captured .t-name { color: rgba(100,220,160,0.9); }
    .t-score { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 1px; color: rgba(100,220,160,0.7); margin-top: 4px; }
    .t-pips { display: flex; gap: 3px; margin-top: 5px; }
    .pip { width: 5px; height: 5px; border: 1px solid rgba(100,150,255,0.2); background: transparent; }
    .pip.done { background: rgba(100,220,160,0.7); border-color: rgba(100,220,160,0.5); }

    /* ── STAGE SCREEN ─────────────────────────── */
    #screen-stage {
      background:
        radial-gradient(ellipse at 50% 80%, rgba(40,60,120,0.12) 0%, transparent 60%),
        linear-gradient(180deg, #08101a 0%, #060a12 100%);
      gap: 0;
    }
    .stage-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; position: relative; z-index: 1; }
    .stage-tag { border-left: 2px solid rgba(100,150,255,0.7); padding-left: 8px; }
    .stage-tag-label { font-family: 'IBM Plex Mono', monospace; font-size: 6px; letter-spacing: 3px; color: rgba(100,150,255,0.5); text-transform: uppercase; margin-bottom: 3px; }
    .stage-tag-name { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 2px; color: #fff; line-height: 1; }
    .stage-meta { text-align: right; }
    .stage-q-of { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 2px; color: rgba(100,150,255,0.4); text-transform: uppercase; margin-bottom: 3px; }
    .stage-score-live { font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; letter-spacing: 2px; color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.35); }
    .stage-progress { height: 2px; background: rgba(100,150,255,0.1); margin-bottom: 14px; position: relative; z-index: 1; }
    .stage-progress-fill { height: 100%; width: 0%; background: rgba(100,150,255,0.7); box-shadow: 0 0 6px rgba(100,150,255,0.4); transition: width 0.4s ease; }

    .q-why { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 1px; color: rgba(255,215,0,0.4); line-height: 1.5; margin-bottom: 8px; position: relative; z-index: 1; }
    .q-text { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; line-height: 1.0; color: #e8eef8; margin-bottom: 14px; position: relative; z-index: 1; }
    .q-options { display: flex; flex-direction: column; gap: 4px; position: relative; z-index: 1; flex: 1; }
    .q-option {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(60,100,140,0.3);
      background: rgba(15,25,45,0.6);
      cursor: pointer;
      transition: border-color 0.12s, background 0.12s;
      position: relative; overflow: hidden;
      user-select: none;
    }
    .q-option::before { content: ''; position: absolute; left: 0; top: 0; width: 0; height: 100%; background: rgba(100,150,255,0.07); transition: width 0.15s; }
    .q-option:hover::before { width: 100%; }
    .q-option:hover { border-color: rgba(100,150,255,0.4); }
    .q-option.selected { border-color: rgba(100,220,160,0.5); background: rgba(10,50,30,0.5); }
    .q-option.selected::before { width: 100%; background: rgba(100,220,160,0.06); }
    .q-letter { font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 1px; color: rgba(100,150,255,0.4); width: 16px; flex-shrink: 0; position: relative; z-index: 1; }
    .q-option.selected .q-letter { color: rgba(100,220,160,0.8); }
    .q-opt-text { font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(180,200,230,0.55); line-height: 1.4; position: relative; z-index: 1; }
    .q-option.selected .q-opt-text { color: rgba(180,230,200,0.85); }

    .q-intel-label { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 3px; color: rgba(100,150,255,0.35); text-transform: uppercase; margin-bottom: 6px; position: relative; z-index: 1; }
    .q-textarea {
      width: 100%; flex: 1; min-height: 100px;
      background: rgba(8,16,28,0.85);
      border: 1px solid rgba(100,150,255,0.2);
      color: rgba(180,210,255,0.8);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px; line-height: 1.6;
      padding: 10px 12px; resize: none; outline: none;
      position: relative; z-index: 1;
      transition: border-color 0.12s;
    }
    .q-textarea:focus { border-color: rgba(100,150,255,0.5); }
    .q-textarea::placeholder { color: rgba(100,150,255,0.2); }

    /* ── STAGE COMPLETE ───────────────────────── */
    #screen-complete {
      background: #040810;
      align-items: center;
      justify-content: center;
      gap: 0;
    }
    #screen-complete::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, rgba(100,220,160,0.07) 0%, transparent 60%); pointer-events: none; }
    .cc-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 4px; color: rgba(100,220,160,0.5); text-transform: uppercase; margin-bottom: 8px; position: relative; z-index: 1; }
    .cc-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 4px; color: rgba(100,220,160,0.9); text-shadow: 0 0 30px rgba(100,220,160,0.25); text-align: center; line-height: 1; margin-bottom: 4px; position: relative; z-index: 1; }
    .cc-subtitle { font-family: 'Bebas Neue', sans-serif; font-size: 14px; letter-spacing: 3px; color: rgba(180,200,230,0.45); margin-bottom: 22px; position: relative; z-index: 1; }
    .cc-score-box { border: 1px solid rgba(100,220,160,0.2); background: rgba(10,50,30,0.4); padding: 14px 28px; text-align: center; margin-bottom: 14px; position: relative; z-index: 1; }
    .cc-score-label { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 3px; color: rgba(100,220,160,0.4); text-transform: uppercase; margin-bottom: 6px; }
    .cc-score-val { font-family: 'Bebas Neue', sans-serif; font-size: 52px; color: rgba(100,220,160,0.9); line-height: 1; }
    .cc-score-pct { font-family: 'IBM Plex Mono', monospace; font-size: 9px; color: rgba(100,220,160,0.45); letter-spacing: 2px; }
    .cc-xp { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 2px; color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.35); margin-bottom: 20px; position: relative; z-index: 1; }
    .cc-bar-wrap { width: 220px; margin-bottom: 10px; position: relative; z-index: 1; }
    .cc-bar-label { font-family: 'IBM Plex Mono', monospace; font-size: 6px; letter-spacing: 2px; color: rgba(100,220,160,0.35); text-transform: uppercase; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .cc-bar { height: 3px; background: rgba(100,220,160,0.1); border: 1px solid rgba(100,220,160,0.15); }
    .cc-bar-fill { height: 100%; width: 0%; background: rgba(100,220,160,0.7); box-shadow: 0 0 6px rgba(100,220,160,0.3); transition: width 0.6s ease; }

    /* ── DEBRIEF ──────────────────────────────── */
    #screen-debrief {
      background: linear-gradient(180deg, #060c16 0%, #04080e 100%);
      gap: 8px;
    }
    #screen-debrief::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 0%, rgba(100,150,255,0.08) 0%, transparent 50%); pointer-events: none; }
    .db-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 4px; color: rgba(100,150,255,0.4); text-transform: uppercase; position: relative; z-index: 1; }
    .db-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 2px; color: #fff; line-height: 1; margin-bottom: 2px; position: relative; z-index: 1; }
    .db-profile-score { font-family: 'IBM Plex Mono', monospace; font-size: 8px; letter-spacing: 2px; color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.3); position: relative; z-index: 1; margin-bottom: 4px; }
    .db-summary { font-size: 11px; color: rgba(180,200,230,0.4); line-height: 1.5; position: relative; z-index: 1; max-width: 480px; margin-bottom: 4px; }
    .db-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; position: relative; z-index: 1; flex: 1; }
    .db-card { background: rgba(15,25,45,0.6); border: 1px solid rgba(60,100,140,0.25); padding: 10px 11px; }
    .db-card.gap { border-color: rgba(247,37,133,0.25); }
    .db-card.strength { border-color: rgba(100,220,160,0.25); }
    .db-card-label { font-family: 'IBM Plex Mono', monospace; font-size: 6px; letter-spacing: 2px; text-transform: uppercase; color: rgba(100,150,255,0.4); margin-bottom: 4px; }
    .db-card.gap .db-card-label { color: rgba(247,37,133,0.5); }
    .db-card.strength .db-card-label { color: rgba(100,220,160,0.5); }
    .db-card-name { font-family: 'Bebas Neue', sans-serif; font-size: 15px; letter-spacing: 1px; color: rgba(180,200,230,0.8); margin-bottom: 2px; }
    .db-card-score { font-family: 'IBM Plex Mono', monospace; font-size: 7px; letter-spacing: 1px; color: rgba(180,200,230,0.35); }
    .db-card.gap .db-card-score { color: rgba(247,37,133,0.5); }
    .db-card.strength .db-card-score { color: rgba(100,220,160,0.6); }
    .db-bar { height: 2px; background: rgba(100,150,255,0.1); margin-top: 6px; }
    .db-bar-fill { height: 100%; background: rgba(100,150,255,0.5); }
    .db-card.gap .db-bar-fill { background: rgba(247,37,133,0.5); }
    .db-card.strength .db-bar-fill { background: rgba(100,220,160,0.5); }
    .db-fixes { position: relative; z-index: 1; }
    .db-fixes-title { font-family: 'IBM Plex Mono', monospace; font-size: 6px; letter-spacing: 3px; text-transform: uppercase; color: rgba(100,150,255,0.35); margin-bottom: 5px; }
    .db-fix { font-family: 'IBM Plex Mono', monospace; font-size: 8px; color: rgba(180,200,230,0.45); letter-spacing: 1px; line-height: 1.7; }
    .db-fix span { color: rgba(100,150,255,0.5); margin-right: 6px; }
  </style>
</head>
<body>

  <!-- TOP RESOURCE BAR -->
  <div id="rts-topbar">
    <span class="rts-brand">CF SYS</span>
    <div class="rts-resource">
      <div class="rts-res-dot" style="background:#4cc9f0;box-shadow:0 0 4px #4cc9f0"></div>
      <span class="rts-res-val" id="res-vis" style="color:#4cc9f0">0</span>
      <span class="rts-res-label">Vis</span>
    </div>
    <div class="rts-resource">
      <div class="rts-res-dot" style="background:#f72585;box-shadow:0 0 4px #f72585"></div>
      <span class="rts-res-val" id="res-ops" style="color:#f72585">0</span>
      <span class="rts-res-label">Ops</span>
    </div>
    <div class="rts-resource" style="border-right:none;">
      <div class="rts-res-dot" style="background:#ffd700;box-shadow:0 0 4px #ffd700"></div>
      <span class="rts-res-val" id="res-score" style="color:#ffd700">0</span>
      <span class="rts-res-label">Score</span>
    </div>
    <span id="rts-clock">00:00</span>
  </div>

  <!-- BODY -->
  <div id="rts-body">
    <div id="rts-center">

      <!-- HOME SCREEN -->
      <div id="screen-home" class="screen">
        <div class="screen-grid-bg"></div>
        <div class="map-header">
          <span class="map-title">// Workflow Territory Map</span>
          <span class="map-blink">▶ Select Operation</span>
        </div>
        <div class="territory-grid" id="territory-grid"></div>
      </div>

      <!-- STAGE SCREEN -->
      <div id="screen-stage" class="screen hidden">
        <div class="screen-grid-bg"></div>
        <div class="stage-header">
          <div class="stage-tag">
            <div class="stage-tag-label" id="stage-label"></div>
            <div class="stage-tag-name" id="stage-name"></div>
          </div>
          <div class="stage-meta">
            <div class="stage-q-of" id="stage-q-of"></div>
            <div class="stage-score-live" id="stage-score-live">+000</div>
          </div>
        </div>
        <div class="stage-progress"><div class="stage-progress-fill" id="stage-progress-fill"></div></div>
        <div id="question-host" style="display:flex;flex-direction:column;flex:1;position:relative;z-index:1;"></div>
      </div>

      <!-- STAGE COMPLETE SCREEN -->
      <div id="screen-complete" class="screen hidden">
        <div class="cc-kicker">// Operation Complete</div>
        <div class="cc-title">TERRITORY SECURED</div>
        <div class="cc-subtitle" id="cc-subtitle"></div>
        <div class="cc-score-box">
          <div class="cc-score-label">Stage Score</div>
          <div class="cc-score-val" id="cc-score-val">—</div>
          <div class="cc-score-pct">% Operational Maturity</div>
        </div>
        <div class="cc-xp" id="cc-xp"></div>
        <div class="cc-bar-wrap">
          <div class="cc-bar-label"><span id="cc-bar1-label">Stage Maturity</span><span id="cc-bar1-pct"></span></div>
          <div class="cc-bar"><div class="cc-bar-fill" id="cc-bar1-fill"></div></div>
        </div>
        <div class="cc-bar-wrap">
          <div class="cc-bar-label"><span>Overall Progress</span><span id="cc-bar2-pct"></span></div>
          <div class="cc-bar"><div class="cc-bar-fill" id="cc-bar2-fill"></div></div>
        </div>
      </div>

      <!-- DEBRIEF SCREEN -->
      <div id="screen-debrief" class="screen hidden">
        <div class="screen-grid-bg"></div>
        <div class="db-kicker" id="db-kicker"></div>
        <div class="db-title" id="db-title"></div>
        <div class="db-profile-score" id="db-profile-score"></div>
        <div class="db-summary" id="db-summary"></div>
        <div class="db-grid" id="db-grid"></div>
        <div class="db-fixes">
          <div class="db-fixes-title">// Priority Fixes</div>
          <div id="db-fixes"></div>
        </div>
      </div>

    </div>

    <!-- SIDEBAR -->
    <div id="rts-sidebar">
      <div class="sidebar-title">Intel</div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Visibility</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-visibility" style="background:#4cc9f0"></div></div>
        <div class="sidebar-val" id="sbv-visibility">—</div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Standard</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-standardization" style="background:#f72585"></div></div>
        <div class="sidebar-val" id="sbv-standardization">—</div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Acct.</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-accountability" style="background:#7bed9f"></div></div>
        <div class="sidebar-val" id="sbv-accountability">—</div>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Forecast</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-forecast" style="background:#ffd700"></div></div>
        <div class="sidebar-val" id="sbv-forecast">—</div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Ops</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-ops" style="background:#ff9f43"></div></div>
        <div class="sidebar-val" id="sbv-ops">—</div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Know.</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-knowledge" style="background:#a29bfe"></div></div>
        <div class="sidebar-val" id="sbv-knowledge">—</div>
      </div>
      <div class="sidebar-divider"></div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Scale</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-scalability" style="background:#fd79a8"></div></div>
        <div class="sidebar-val" id="sbv-scalability">—</div>
      </div>
      <div class="sidebar-stat">
        <div class="sidebar-stat-name">Cust.</div>
        <div class="sidebar-bar"><div class="sidebar-bar-fill" id="sb-customer" style="background:#55efc4"></div></div>
        <div class="sidebar-val" id="sbv-customer">—</div>
      </div>
    </div>
  </div>

  <!-- COMMAND BAR -->
  <div id="rts-cmdbar">
    <button class="cmd-btn" id="cmd-left" style="display:none"></button>
    <button class="cmd-btn primary" id="cmd-right">▶ Select an Operation</button>
    <span id="cmd-status"></span>
  </div>

  <script>
    // ── DATA ───────────────────────────────────────────────────────────────
    const categories = {
      visibility:      { name: 'Visibility',          description: 'Can leadership see what is really happening before it becomes a surprise?' },
      standardization: { name: 'Standardization',     description: 'Do teams follow a consistent process, or does every person run their own version?' },
      accountability:  { name: 'Accountability',      description: 'Is ownership clear when a task, deal, handoff, or follow-up stalls?' },
      scalability:     { name: 'Scalability',         description: 'Can the process grow without relying on hero employees and tribal knowledge?' },
      forecast:        { name: 'Forecast Reliability',description: 'Can revenue and workload be predicted with enough confidence to plan?' },
      ops:             { name: 'Operational Readiness',description: 'Can operations execute cleanly on what sales promised?' },
      knowledge:       { name: 'Knowledge Retention', description: 'Does context survive turnover, vacations, overload, and handoffs?' },
      customer:        { name: 'Customer Experience', description: 'Does the process create trust, clarity, and speed for customers?' }
    };

    const questions = [
      { section: 'Lead Source Intelligence', q: 'Do you know which lead sources actually close best?', why: 'This exposes marketing-to-sales visibility gaps.', scores: ['visibility','forecast','scalability'], options: [['Yes — tracked and reported consistently',4],['Mostly — some tracking gaps',3],['Rough idea but unreliable',2],['No visibility',1]] },
      { section: 'Lead Source Intelligence', q: 'Are certain reps better at converting certain lead types?', why: 'This reveals whether routing is based on evidence or gut feel.', scores: ['visibility','standardization','scalability'], options: [['Yes — assignment rules reflect this',4],['Some patterns identified',3],['Anecdotal only',2],['No visibility',1]] },
      { section: 'Lead Source Intelligence', q: 'How much manual work is required before a lead is sales-ready?', why: 'Hidden admin drag is one of the quietest blockers to scale.', scores: ['scalability','standardization','customer'], options: [['Fully automated intake',4],['Minimal cleanup',3],['Moderate manual enrichment',2],['Significant admin before outreach',1]] },
      { section: 'Estimating / Proposal Workflow', q: 'Where does estimating information currently live?', why: 'Proposal inconsistency creates margin risk and downstream confusion.', scores: ['knowledge','standardization','ops'], options: [['Centralized system',4],['Shared folders/spreadsheets',3],['Individual estimator files',2],['Mixed across systems',1]] },
      { section: 'Estimating / Proposal Workflow', q: 'How often are proposals delayed because information is missing?', why: 'Missing information before proposal usually becomes rework after close.', scores: ['ops','customer','standardization'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constant issue',1]] },
      { section: 'Estimating / Proposal Workflow', q: 'How standardized are your proposal templates and scopes?', why: 'Variation in proposal language can turn into variation in execution.', scores: ['standardization','ops','scalability'], options: [['Fully standardized',4],['Mostly standardized',3],['Significant variation',2],['Every rep/team does it differently',1]] },
      { section: 'Accountability & Ownership', q: 'If a task is overdue, who owns escalating it?', why: 'This is where workflows reveal whether ownership is real or implied.', scores: ['accountability','scalability','customer'], options: [['Clearly defined ownership',4],['Usually managers',3],['Depends on the situation',2],['Nobody consistently owns it',1]] },
      { section: 'Accountability & Ownership', q: 'How often do deals rely on one person remembering something important?', why: 'When memory is the system, turnover and overload become operational risks.', scores: ['knowledge','accountability','scalability'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constantly',1]] },
      { section: 'Accountability & Ownership', q: 'If leadership asked for pipeline accuracy today, how confident would you be?', why: 'Pipeline confidence is an accountability test, not just a reporting test.', scores: ['forecast','visibility','accountability'], options: [['Very confident',4],['Mostly confident',3],['Moderate concern',2],['Low confidence',1]] },
      { section: 'Forecasting & Revenue Visibility', q: 'How accurate is your sales forecast?', why: 'Forecast reliability connects sales workflow directly to operational planning.', scores: ['forecast','visibility'], options: [['Within 5–10% consistently',4],['Usually close',3],['Often inaccurate',2],['Essentially guessing',1]] },
      { section: 'Forecasting & Revenue Visibility', q: 'What typically causes forecast misses?', why: 'The reason for the miss tells you which part of the workflow needs attention.', scores: ['forecast','visibility','standardization'], options: [['Market factors',4],['Customer delays',3],['Poor pipeline visibility',2],['Reps not updating information',1],['Undefined stages',1]] },
      { section: 'Forecasting & Revenue Visibility', q: 'How far ahead can you confidently forecast workload/revenue?', why: 'Short visibility windows make staffing, cash flow, and project planning harder.', scores: ['forecast','ops','scalability'], options: [['6–12 months',4],['3–6 months',3],['1–3 months',2],['Less than 30 days',1]] },
      { section: 'Communication & Decision Tracking', q: 'Where are key customer decisions typically documented?', why: 'Decision history is only useful if the next person can find it.', scores: ['knowledge','visibility','customer'], options: [['CRM/system notes',4],['Email threads',3],['Meeting notes/docs',2],['Mostly verbal',1]] },
      { section: 'Communication & Decision Tracking', q: 'How often do teams revisit old conversations to understand decisions?', why: 'If people keep searching old conversations, the workflow is not preserving context.', scores: ['knowledge','customer','scalability'], options: [['Rarely needed',4],['Occasionally',3],['Frequently',2],['Constant issue',1]] },
      { section: 'Communication & Decision Tracking', q: 'How easy is it for another team member to understand the full history of a deal?', why: 'This exposes tribal knowledge risk.', scores: ['knowledge','visibility','scalability'], options: [['Very easy',4],['Mostly understandable',3],['Difficult',2],['Nearly impossible without asking someone',1]] },
      { section: 'Operational Readiness Before Close', q: 'Before a project is sold, how involved is operations/preconstruction?', why: 'This is where margin erosion often starts before the job even opens.', scores: ['ops','accountability','forecast'], options: [['Deeply involved throughout',4],['Involved for larger projects',3],['Occasionally consulted',2],['Rarely involved before close',1]] },
      { section: 'Operational Readiness Before Close', q: 'How often are sold projects operationally different than expected?', why: 'Sales-to-ops mismatch is a handoff problem with a margin consequence.', scores: ['ops','standardization','customer'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constant issue',1]] },
      { section: 'Operational Readiness Before Close', q: 'How often are scope assumptions undocumented?', why: 'Undocumented assumptions become disputes, rework, and uncomfortable handoffs.', scores: ['ops','knowledge','accountability'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constantly',1]] },
      { section: 'Process Variability', q: 'How differently do top performers operate compared to average reps?', why: 'Scalable companies reduce unnecessary process variability.', scores: ['standardization','scalability'], options: [['Very similarly',4],['Minor variations',3],['Significant differences',2],['Everyone has their own process',1]] },
      { section: 'Process Variability', q: 'Could a new hire follow your sales process without shadowing someone?', why: 'Documentation is a maturity signal, not paperwork for its own sake.', scores: ['standardization','knowledge','scalability'], options: [['Yes — fully documented',4],['Mostly',3],['Only partially',2],['No — relies on tribal knowledge',1]] },
      { section: 'Process Variability', q: 'How often are exceptions handled outside the normal process?', why: 'Too many exceptions usually means the normal process is not trusted.', scores: ['standardization','accountability','customer'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constantly',1]] },
      { section: 'Customer Experience Friction', q: 'Where do customers experience the most confusion or delays?', why: 'Internal workflow problems eventually become customer experience problems.', scores: [], options: [['Initial response',0],['Proposal process',0],['Contracting',0],['Handoff/startup',0],['Communication during execution',0]] },
      { section: 'Customer Experience Friction', q: 'How often do customers need to repeat information?', why: 'Repeated customer information is a handoff failure customers can feel.', scores: ['customer','knowledge','standardization'], options: [['Rarely',4],['Occasionally',3],['Frequently',2],['Constantly',1]] },
      { section: 'Customer Experience Friction', q: 'How consistent is the customer experience across reps?', why: 'Consistency is a trust signal.', scores: ['customer','standardization','scalability'], options: [['Very consistent',4],['Mostly consistent',3],['Significant variation',2],['Depends entirely on the rep',1]] },
      { section: 'Automation Readiness', q: 'Are repetitive sales/admin tasks standardized enough to automate?', why: 'Automation readiness is really process readiness.', scores: ['standardization','scalability','visibility'], options: [['Yes — highly standardized',4],['Mostly standardized',3],['Some standardization',2],['Highly inconsistent',1]] },
      { section: 'Automation Readiness', q: 'Which process consumes the most unnecessary manual effort?', why: 'This answer is often the best starting point for workflow cleanup.', type: 'text', placeholder: 'Example: proposal follow-up, lead cleanup, project handoff, missing billing backup...' },
      { section: 'Automation Readiness', q: 'If you improved one workflow tomorrow, what would it be?', why: 'The first fix should be specific enough to assign, measure, and repeat.', type: 'text', placeholder: 'Example: standardize the sales-to-ops handoff before project startup...' }
    ];

    const profiles = [
      { min: 0,  name: 'Reactive & Tribal',      summary: 'The workflow depends heavily on people remembering, chasing, and interpreting context. Visibility is limited, ownership is inconsistent, and leadership likely sees problems after they have already affected customers or operations.', priority: ['Make ownership explicit', 'Create one source of truth for active deals', 'Document the handoff from sales to operations'] },
      { min: 45, name: 'Growing but Fragmented',  summary: 'The business has working habits, but they vary by person, team, or project. Some information is visible, some lives in inboxes and spreadsheets, and follow-up depends too much on individual discipline.', priority: ['Standardize the highest-friction workflow', 'Define escalation rules for stalled tasks', 'Clean up lead and proposal tracking'] },
      { min: 62, name: 'Structured but Siloed',   summary: 'The core process exists, but information still gets trapped between departments, systems, or roles. Forecasting, customer history, and operational readiness may look fine until a handoff gets tested.', priority: ['Tighten sales-to-ops handoff requirements', 'Connect decision history to pipeline stages', 'Measure forecast misses by cause'] },
      { min: 78, name: 'Connected Operations',    summary: 'The workflow is mostly visible and repeatable. The biggest opportunity is reducing remaining exceptions, improving forecast confidence, and turning strong individual habits into a scalable operating system.', priority: ['Reduce process exceptions', 'Improve cross-team reporting', 'Automate the cleanest repetitive workflows'] },
      { min: 90, name: 'Operationally Mature',    summary: 'The process is visible, owned, and repeatable. Leadership can see reality, teams know what happens next, and customer experience is less dependent on individual heroics.', priority: ['Benchmark leading indicators', 'Automate low-risk admin tasks', 'Use workflow data to coach and plan capacity'] }
    ];

    // ── STAGE MAPPING ───────────────────────────────────────────────────────
    const STAGE_NAMES = [
      'Lead Intelligence',
      'Estimating & Proposals',
      'Accountability & Ownership',
      'Forecasting & Revenue',
      'Communication & Decisions',
      'Ops Readiness',
      'Process Variability',
      'Customer Experience',
      'Automation Readiness'
    ];

    function stageQuestionIndices(stageIndex) {
      const s = stageIndex * 3;
      return [s, s + 1, s + 2];
    }

    // ── STATE ───────────────────────────────────────────────────────────────
    let answers = Array(27).fill(null);
    let textAnswers = Array(27).fill('');
    let completedStages = new Set();
    let stageScorePct = {};
    let currentStage = null;
    let currentQuestionInStage = 0;
    let clockSeconds = 0;
    let clockInterval = null;

    // ── SCORE HELPERS ───────────────────────────────────────────────────────
    function categoryScores() {
      const totals = Object.fromEntries(Object.keys(categories).map(k => [k, { earned: 0, possible: 0 }]));
      questions.forEach((q, i) => {
        if (q.type === 'text' || !q.scores?.length || answers[i] === null) return;
        const value = q.options[answers[i]][1];
        q.scores.forEach(cat => { totals[cat].earned += value; totals[cat].possible += 4; });
      });
      return totals;
    }

    function overallScore() {
      const totals = categoryScores();
      const earned = Object.values(totals).reduce((s, t) => s + t.earned, 0);
      const possible = Object.values(totals).reduce((s, t) => s + t.possible, 0);
      return possible ? Math.round((earned / possible) * 100) : 0;
    }

    function profileFor(score) {
      return profiles.filter(p => score >= p.min).slice(-1)[0];
    }

    function rankedCategories() {
      const totals = categoryScores();
      return Object.entries(totals).map(([key, t]) => ({
        key,
        pct: t.possible ? Math.round((t.earned / t.possible) * 100) : 0,
        earned: t.earned,
        possible: t.possible
      })).sort((a, b) => a.pct - b.pct);
    }

    function computeStageScore(stageIndex) {
      let earned = 0, possible = 0;
      stageQuestionIndices(stageIndex).forEach(i => {
        const q = questions[i];
        if (q.type === 'text' || !q.scores?.length || answers[i] === null) return;
        earned += q.options[answers[i]][1];
        possible += 4;
      });
      return possible ? Math.round((earned / possible) * 100) : 0;
    }

    // ── HUD ─────────────────────────────────────────────────────────────────
    function updateSidebar() {
      const totals = categoryScores();
      Object.entries(totals).forEach(([key, t]) => {
        const pct = t.possible ? Math.round((t.earned / t.possible) * 100) : 0;
        const fill = document.getElementById('sb-' + key);
        const val  = document.getElementById('sbv-' + key);
        if (!fill || !val) return;
        fill.style.width = (t.possible ? pct : 0) + '%';
        val.textContent = t.possible ? pct + '%' : '—';
        val.style.color = t.possible ? '' : '#3a4a5a';
      });
    }

    function updateResourceBar() {
      const totals = categoryScores();
      const visPct = totals.visibility.possible ? Math.round((totals.visibility.earned / totals.visibility.possible) * 100) : 0;
      const opsPct = totals.ops.possible ? Math.round((totals.ops.earned / totals.ops.possible) * 100) : 0;
      const rawTotal = Object.values(totals).reduce((s, t) => s + t.earned, 0);
      animateCounter('res-vis',   Math.round(visPct * 22));
      animateCounter('res-ops',   Math.round(opsPct * 18));
      animateCounter('res-score', Math.round(rawTotal * 75));
    }

    const _counterTargets = {};
    function animateCounter(id, target) {
      _counterTargets[id] = target;
      const el = document.getElementById(id);
      if (!el) return;
      const current = parseInt(el.textContent.replace(/,/g, ''), 10) || 0;
      const delta = target - current;
      if (delta === 0) return;
      let frame = 0;
      const total = 20;
      const tick = () => {
        frame++;
        const eased = 1 - Math.pow(1 - frame / total, 3);
        el.textContent = Math.round(current + delta * eased).toLocaleString();
        if (frame < total && _counterTargets[id] === target) requestAnimationFrame(tick);
        else if (_counterTargets[id] === target) el.textContent = target.toLocaleString();
      };
      requestAnimationFrame(tick);
    }

    function startClock() {
      if (clockInterval) return;
      clockInterval = setInterval(() => {
        clockSeconds++;
        const m = String(Math.floor(clockSeconds / 60)).padStart(2, '0');
        const s = String(clockSeconds % 60).padStart(2, '0');
        document.getElementById('rts-clock').textContent = m + ':' + s;
      }, 1000);
    }

    // ── SCREEN ROUTER ───────────────────────────────────────────────────────
    const SCREENS = ['screen-home','screen-stage','screen-complete','screen-debrief'];
    function showScreen(name) {
      SCREENS.forEach(id => document.getElementById(id).classList.toggle('hidden', id !== name));
    }

    // ── HOME SCREEN ─────────────────────────────────────────────────────────
    function renderHome() {
      showScreen('screen-home');
      updateSidebar();
      updateResourceBar();

      const fogCleared = completedStages.size > 0;
      document.getElementById('territory-grid').innerHTML = STAGE_NAMES.map((name, i) => {
        const done = completedStages.has(i);
        const inFog = !fogCleared && i >= 7;
        const score = done ? stageScorePct[i] : null;
        const pipsHtml = [0,1,2].map(p => `<div class="pip${done ? ' done' : ''}"></div>`).join('');
        return `
          <div class="territory${done ? ' captured' : ''}${inFog ? ' fog' : ''}"
               onclick="enterStage(${i})">
            <div class="t-num">Op-${String(i+1).padStart(2,'0')}</div>
            <div class="t-name">${name}</div>
            ${done ? `<div class="t-score">▲ ${score}%</div>` : ''}
            ${!inFog ? `<div class="t-pips">${pipsHtml}</div>` : ''}
          </div>`;
      }).join('');

      const remaining = 9 - completedStages.size;
      document.getElementById('cmd-left').style.display = 'none';
      document.getElementById('cmd-right').textContent = '▶ Select an Operation';
      document.getElementById('cmd-right').disabled = true;
      document.getElementById('cmd-right').onclick = null;
      document.getElementById('cmd-status').innerHTML =
        `<span>${completedStages.size}</span> / 9 Operations Complete &nbsp;·&nbsp; ${remaining} Remaining`;
    }

    function enterStage(stageIndex) {
      currentStage = stageIndex;
      if (completedStages.has(stageIndex)) {
        stageQuestionIndices(stageIndex).forEach(i => { answers[i] = null; textAnswers[i] = ''; });
        completedStages.delete(stageIndex);
        delete stageScorePct[stageIndex];
      }
      currentQuestionInStage = 0;
      renderStageScreen();
    }

    // ── STAGE SCREEN ────────────────────────────────────────────────────────
    function renderStageScreen() {
      showScreen('screen-stage');
      const qIdx = stageQuestionIndices(currentStage)[currentQuestionInStage];
      const q = questions[qIdx];
      const isText = q.type === 'text';
      const isAnswered = isText ? textAnswers[qIdx].trim().length > 0 : answers[qIdx] !== null;

      document.getElementById('stage-label').textContent =
        `▶ Operation ${String(currentStage+1).padStart(2,'0')} · Active`;
      document.getElementById('stage-name').textContent = STAGE_NAMES[currentStage];
      document.getElementById('stage-q-of').textContent =
        `Question ${String(currentQuestionInStage+1).padStart(2,'0')} / 03`;
      document.getElementById('stage-score-live').textContent =
        '+' + String(computeStageScore(currentStage)).padStart(3,'0');
      document.getElementById('stage-progress-fill').style.width =
        (currentQuestionInStage / 3 * 100) + '%';

      const host = document.getElementById('question-host');
      if (isText) {
        host.innerHTML = `
          <div class="q-why">↳ ${q.why}</div>
          <div class="q-text">${q.q}</div>
          <div class="q-intel-label">// Intel Input</div>
          <textarea class="q-textarea" id="q-textarea"
            placeholder="${q.placeholder || 'Type your intel report...'}"
          >${textAnswers[qIdx]}</textarea>`;
        document.getElementById('q-textarea').addEventListener('input', e => {
          textAnswers[qIdx] = e.target.value;
          updateNextBtn();
        });
      } else {
        host.innerHTML = `
          <div class="q-why">↳ ${q.why}</div>
          <div class="q-text">${q.q}</div>
          <div class="q-options">
            ${q.options.map((opt, i) => `
              <div class="q-option${answers[qIdx] === i ? ' selected' : ''}"
                   onclick="selectAnswer(${i})">
                <span class="q-letter">${String.fromCharCode(65+i)}</span>
                <span class="q-opt-text">${opt[0]}</span>
              </div>`).join('')}
          </div>`;
      }

      const isLastQ = currentQuestionInStage === 2;
      document.getElementById('cmd-left').style.display = '';
      document.getElementById('cmd-left').textContent = '◀ Abort';
      document.getElementById('cmd-left').onclick = abortStage;
      document.getElementById('cmd-right').textContent = isLastQ
        ? (isText ? 'Submit Intel ▶' : 'Complete Op ▶')
        : (isText ? 'Submit Intel ▶' : 'Next ▶');
      document.getElementById('cmd-right').disabled = !isAnswered;
      document.getElementById('cmd-right').onclick = nextQuestion;
      document.getElementById('cmd-status').innerHTML = isAnswered
        ? `<span>[${isText ? 'INTEL' : String.fromCharCode(65 + (answers[qIdx] ?? 0))}]</span> — Press Enter to advance`
        : 'Awaiting Input';

      updateSidebar();
      updateResourceBar();
    }

    function updateNextBtn() {
      const qIdx = stageQuestionIndices(currentStage)[currentQuestionInStage];
      const q = questions[qIdx];
      const isAnswered = q.type === 'text' ? textAnswers[qIdx].trim().length > 0 : answers[qIdx] !== null;
      document.getElementById('cmd-right').disabled = !isAnswered;
      document.getElementById('cmd-status').innerHTML = isAnswered
        ? `<span>[INTEL]</span> — Press Enter to advance`
        : 'Awaiting Input';
    }

    function selectAnswer(optionIndex) {
      const qIdx = stageQuestionIndices(currentStage)[currentQuestionInStage];
      answers[qIdx] = optionIndex;
      renderStageScreen();
    }

    function nextQuestion() {
      const qIdx = stageQuestionIndices(currentStage)[currentQuestionInStage];
      const q = questions[qIdx];
      const isAnswered = q.type === 'text' ? textAnswers[qIdx].trim().length > 0 : answers[qIdx] !== null;
      if (!isAnswered) return;
      if (currentQuestionInStage < 2) {
        currentQuestionInStage++;
        renderStageScreen();
      } else {
        finishStage();
      }
    }

    function abortStage() {
      currentStage = null;
      currentQuestionInStage = 0;
      renderHome();
    }

    // ── STAGE COMPLETE ──────────────────────────────────────────────────────
    function finishStage() {
      const score = computeStageScore(currentStage);
      completedStages.add(currentStage);
      stageScorePct[currentStage] = score;
      renderStageComplete(currentStage, score);
    }

    function renderStageComplete(stageIndex, score) {
      showScreen('screen-complete');
      const stagesComplete = completedStages.size;
      const overallPct = Math.round((stagesComplete / 9) * 100);
      const points = Math.round(score * 3);

      document.getElementById('cc-subtitle').textContent =
        `Operation ${String(stageIndex+1).padStart(2,'0')} — ${STAGE_NAMES[stageIndex]}`;
      document.getElementById('cc-score-val').textContent = score;
      document.getElementById('cc-xp').textContent = `+ ${points} Score Points Earned`;
      document.getElementById('cc-bar1-label').textContent = STAGE_NAMES[stageIndex] + ' Maturity';
      document.getElementById('cc-bar1-pct').textContent = score + '%';
      document.getElementById('cc-bar2-pct').textContent = `${stagesComplete} / 9`;

      requestAnimationFrame(() => {
        document.getElementById('cc-bar1-fill').style.width = score + '%';
        document.getElementById('cc-bar2-fill').style.width = overallPct + '%';
      });

      document.getElementById('cmd-left').style.display = 'none';
      document.getElementById('cmd-right').textContent = '◀ Return to Map';
      document.getElementById('cmd-right').disabled = false;
      document.getElementById('cmd-right').onclick = returnToMap;
      document.getElementById('cmd-status').innerHTML =
        `${9 - stagesComplete} Operations Remaining`;

      updateSidebar();
      updateResourceBar();
    }

    function returnToMap() {
      if (completedStages.size === 9) {
        renderDebrief();
      } else {
        currentStage = null;
        currentQuestionInStage = 0;
        renderHome();
      }
    }

    // ── MISSION DEBRIEF ─────────────────────────────────────────────────────
    function renderDebrief() {
      showScreen('screen-debrief');
      const score = overallScore();
      const profile = profileFor(score);
      const ranked = rankedCategories();
      const weakest = ranked.slice(0, 2);
      const strongest = ranked.slice(-2).reverse();

      document.getElementById('db-kicker').textContent =
        '// Mission Complete — All 9 Territories Secured';
      document.getElementById('db-title').textContent = profile.name;
      document.getElementById('db-profile-score').textContent =
        score + '% Operational Maturity Score';
      document.getElementById('db-summary').textContent = profile.summary;

      const cardHtml = (items, type) => items.map(item => `
        <div class="db-card ${type}">
          <div class="db-card-label">${type === 'gap' ? '↓ Priority Gap' : '↑ Relative Strength'}</div>
          <div class="db-card-name">${categories[item.key].name}</div>
          <div class="db-card-score">${item.pct}%</div>
          <div class="db-bar"><div class="db-bar-fill" style="width:${item.pct}%"></div></div>
        </div>`).join('');

      document.getElementById('db-grid').innerHTML =
        cardHtml(weakest, 'gap') + cardHtml(strongest, 'strength');

      document.getElementById('db-fixes').innerHTML = profile.priority.map((fix, i) => `
        <div class="db-fix"><span>${String(i+1).padStart(2,'0')}.</span>${fix}</div>`).join('');

      document.getElementById('cmd-left').style.display = '';
      document.getElementById('cmd-left').textContent = 'Replay';
      document.getElementById('cmd-left').onclick = replayAll;
      document.getElementById('cmd-right').textContent = '↓ Download Report';
      document.getElementById('cmd-right').disabled = false;
      document.getElementById('cmd-right').onclick = downloadReport;
      document.getElementById('cmd-status').innerHTML =
        `Mission Complete &nbsp;·&nbsp; <span>${score}%</span> Maturity`;

      updateSidebar();
      updateResourceBar();
    }

    function replayAll() {
      answers.fill(null);
      textAnswers.fill('');
      completedStages.clear();
      stageScorePct = {};
      currentStage = null;
      currentQuestionInStage = 0;
      clockSeconds = 0;
      updateSidebar();
      updateResourceBar();
      renderHome();
    }

    // ── REPORT DOWNLOAD ─────────────────────────────────────────────────────
    function escapeHtml(v = '') {
      return String(v)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }

    function buildReportHtml() {
      const score = overallScore();
      const profile = profileFor(score);
      const ranked = rankedCategories();
      const weakest = ranked.slice(0, 3);
      const strongest = ranked.slice(-3).reverse();
      const generatedAt = new Date().toLocaleDateString(undefined, { year:'numeric', month:'long', day:'numeric' });

      const categoryRows = ranked.map(item => `
        <tr><td>${escapeHtml(categories[item.key].name)}</td><td>${item.pct}%</td><td>${escapeHtml(categories[item.key].description)}</td></tr>`).join('');
      const priorityItems = profile.priority.map(p => `<li>${escapeHtml(p)}</li>`).join('');
      const gapItems = weakest.map(item =>
        `<li><strong>${escapeHtml(categories[item.key].name)}:</strong> ${item.pct}% — ${escapeHtml(categories[item.key].description)}</li>`).join('');
      const strengthItems = strongest.map(item =>
        `<li><strong>${escapeHtml(categories[item.key].name)}:</strong> ${item.pct}% — ${escapeHtml(categories[item.key].description)}</li>`).join('');
      const answerRows = questions.map((q, i) => {
        const ans = q.type === 'text'
          ? (textAnswers[i] || 'No response captured.')
          : (answers[i] === null ? 'Not answered' : q.options[answers[i]][0]);
        return `<tr><td>${String(i+1).padStart(2,'0')}</td><td>${escapeHtml(q.section)}</td><td>${escapeHtml(q.q)}</td><td>${escapeHtml(ans)}</td></tr>`;
      }).join('');

      return `<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Construct Flows Operational Maturity Report</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;padding:34px;font-family:'Inter',Arial,sans-serif;color:#111;background:#F6F4EF;line-height:1.7}.report{max-width:980px;margin:0 auto;background:#fff;border:1px solid #E5E5E5}header{padding:30px;border-bottom:1px solid #E5E5E5}h1,h2,h3{font-family:'Bebas Neue',Impact,sans-serif;text-transform:uppercase;line-height:.92;margin:0;letter-spacing:-1px;color:#111;font-weight:700}h1{font-size:58px;max-width:820px}h2{font-size:38px;margin:34px 0 14px}h3{font-family:'IBM Plex Mono',monospace;font-size:24px;margin:24px 0 10px;letter-spacing:0}.kicker{display:inline-block;border:1px solid #E5E5E5;padding:6px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;color:#686868;margin-bottom:18px}.content{padding:30px}.score{display:inline-block;border:1px solid #111;background:#111;color:#fff;padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-weight:500;text-transform:uppercase;letter-spacing:1px;margin:18px 0;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #E5E5E5;margin-top:18px}.card{padding:20px;border-right:1px solid #E5E5E5;background:#fff}.card:last-child{border-right:0}.card p{color:#686868;font-weight:400;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #E5E5E5;padding:10px;vertical-align:top;text-align:left;font-size:13px}th{background:#111;color:#fff;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;font-weight:500}ul{padding-left:20px;margin:10px 0}ul li{color:#686868;font-weight:400;margin-bottom:6px;line-height:1.6}p{color:#686868;font-weight:400}.footer{padding:18px 30px;border-top:1px solid #E5E5E5;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;color:#686868}@media print{body{background:#fff;padding:0}.report{border:0}}</style>
</head><body><article class="report">
<header><div class="kicker">Construct Flows assessment report</div><h1>${escapeHtml(profile.name)}</h1><div class="score">${score}% operational maturity score</div><p>${escapeHtml(profile.summary)}</p><p><strong>Generated:</strong> ${escapeHtml(generatedAt)}</p></header>
<div class="content">
<h2>What this means</h2><p>This report shows where the sales workflow is most likely creating visibility gaps, ownership gaps, handoff friction, forecasting risk, customer confusion, or downstream execution problems.</p>
<div class="grid"><div class="card"><h3>Priority gaps</h3><ul>${gapItems}</ul></div><div class="card"><h3>Relative strengths</h3><ul>${strengthItems}</ul></div></div>
<h2>First workflow fixes</h2><ul>${priorityItems}</ul>
<h2>Category scores</h2><table><thead><tr><th>Category</th><th>Score</th><th>What it measures</th></tr></thead><tbody>${categoryRows}</tbody></table>
<h2>Assessment answers</h2><table><thead><tr><th>#</th><th>Section</th><th>Question</th><th>Answer</th></tr></thead><tbody>${answerRows}</tbody></table>
</div><div class="footer"><span>Construct Flows</span><span>Better workflows. Fewer loose ends.</span></div>
</article></body></html>`;
    }

    function downloadReport() {
      const html = buildReportHtml();
      const score = overallScore();
      const profile = profileFor(score);
      const slug = profile.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `constructionflows-operational-maturity-${slug}-${score}.html`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ── ENTER KEY ───────────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
      if (currentStage === null) return;
      if (document.activeElement && document.activeElement.id === 'cmd-left') return;
      const qIdx = stageQuestionIndices(currentStage)[currentQuestionInStage];
      const q = questions[qIdx];
      if (q.type === 'text' && document.activeElement && document.activeElement.id === 'q-textarea') {
        textAnswers[qIdx] = document.activeElement.value;
      }
      e.preventDefault();
      nextQuestion();
    });

    // ── BOOTSTRAP ───────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', () => {
      startClock();
      renderHome();
    });
  </script>
</body>
</html>
